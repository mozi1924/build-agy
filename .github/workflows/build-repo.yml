name: Build & Deploy Antigravity Repository

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      rebuild_pages_only:
        description: 'Rebuild and deploy Pages only (do not rebuild packages)'
        required: false
        type: boolean
        default: false
      force:
        description: 'Force rebuild all packages even if version is unchanged'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check-versions:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.condition.outputs.should_build }}
      rebuild_pages_only: ${{ steps.condition.outputs.rebuild_pages_only }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Latest Metadata & Changelogs
        id: condition
        run: |
          pip install beautifulsoup4 jinja2 requests
          if [ "${{ github.event.inputs.rebuild_pages_only }}" = "true" ]; then
            echo "rebuild_pages_only=true" >> $GITHUB_OUTPUT
            echo "should_build=false" >> $GITHUB_OUTPUT
            python3 scripts/fetch_metadata.py || true
          else
            echo "rebuild_pages_only=false" >> $GITHUB_OUTPUT
            python3 scripts/fetch_metadata.py --check-new > check_output.txt
            cat check_output.txt
            if [ "${{ github.event.inputs.force }}" = "true" ] || grep -q "TO_BUILD=" check_output.txt || [ ! -f "versions.json" ]; then
              echo "should_build=true" >> $GITHUB_OUTPUT
            else
              echo "should_build=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Upload Metadata Artifact
        uses: actions/upload-artifact@v4
        with:
          name: metadata
          path: metadata.json

  build-packages:
    needs: check-versions
    if: needs.check-versions.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [cli, hub, ide]
        arch: [x86_64, aarch64]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Metadata Artifact
        uses: actions/download-artifact@v4
        with:
          name: metadata

      - name: Install System Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm createrepo-c dpkg-dev
          pip install beautifulsoup4 jinja2 requests

      - name: Build Package (${{ matrix.component }} - ${{ matrix.arch }})
        run: |
          python3 scripts/build_packages.py -c "${{ matrix.component }}" -a "${{ matrix.arch }}"

      - name: Upload Built Packages
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.component }}-${{ matrix.arch }}
          path: |
            dist/deb/*.deb
            dist/rpm/*.rpm

  deploy-repo:
    needs: [check-versions, build-packages]
    if: always() && (needs.build-packages.result == 'success' || needs.check-versions.outputs.rebuild_pages_only == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Metadata Artifact
        uses: actions/download-artifact@v4
        with:
          name: metadata

      - name: Install System Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm createrepo-c dpkg-dev gh
          pip install beautifulsoup4 jinja2 requests

      - name: Download Existing Release Assets (Pages-only mode)
        if: needs.check-versions.outputs.rebuild_pages_only == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist/deb dist/rpm
          echo "Fetching assets from latest GitHub release..."
          gh release download --pattern "*.deb" --dir dist/deb --clobber
          gh release download --pattern "*.rpm" --dir dist/rpm --clobber
          echo "Downloaded DEB assets:"
          ls -la dist/deb
          echo "Downloaded RPM assets:"
          ls -la dist/rpm

      - name: Download & Aggregate Built Packages (Full Build mode)
        if: needs.check-versions.outputs.rebuild_pages_only != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: artifacts
          merge-multiple: true

      - name: Aggregate Packages into dist/ (Full Build mode)
        if: needs.check-versions.outputs.rebuild_pages_only != 'true'
        run: |
          mkdir -p dist/deb dist/rpm
          find artifacts -name '*.deb' -exec cp -v {} dist/deb/ \;
          find artifacts -name '*.rpm' -exec cp -v {} dist/rpm/ \;
          echo "Aggregated DEB packages:"
          ls -la dist/deb
          echo "Aggregated RPM packages:"
          ls -la dist/rpm

      - name: Determine Release Tag
        id: release_info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ needs.check-versions.outputs.rebuild_pages_only }}" = "true" ]; then
            TAG=$(gh release list -L 1 --json tagName -q '.[0].tagName')
          else
            IDE_VER=$(python3 -c "import json; print(json.load(open('metadata.json'))['ide']['version'])")
            TAG="v${IDE_VER}-$(date -u +%Y%m%d-%H%M)"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          echo "Using release tag: ${TAG}"

      - name: Generate APT and RPM Repositories
        run: |
          python3 scripts/update_repo.py --tag "${{ steps.release_info.outputs.tag }}"

      - name: Create GitHub Release & Upload Assets (Full Build mode)
        if: needs.check-versions.outputs.rebuild_pages_only != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/publish_release.py --tag "${{ steps.release_info.outputs.tag }}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "chore: update version state [skip ci]" || true
          git push origin main || true

      - name: Update APT Flat Indices on Release (Pages-only mode)
        if: needs.check-versions.outputs.rebuild_pages_only == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/publish_release.py --upload-indices-only --tag "${{ steps.release_info.outputs.tag }}"

      - name: Generate Web Portal
        run: |
          python3 scripts/generate_web.py --tag "${{ steps.release_info.outputs.tag }}"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

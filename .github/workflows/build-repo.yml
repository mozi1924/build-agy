name: Build & Deploy Antigravity Repository

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild all packages even if version is unchanged'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check-versions:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.condition.outputs.should_build }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Latest Metadata & Changelogs
        id: condition
        run: |
          pip install beautifulsoup4 jinja2 requests
          python3 scripts/fetch_metadata.py --check-new > check_output.txt
          cat check_output.txt
          if [ "${{ github.event.inputs.force }}" = "true" ] || grep -q "TO_BUILD=" check_output.txt || [ ! -f "versions.json" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Metadata Artifact
        if: steps.condition.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: metadata
          path: metadata.json

  build-packages:
    needs: check-versions
    if: needs.check-versions.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [cli, hub, ide]
        arch: [x86_64, aarch64]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Metadata Artifact
        uses: actions/download-artifact@v4
        with:
          name: metadata

      - name: Install System Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm createrepo-c dpkg-dev
          pip install beautifulsoup4 jinja2 requests

      - name: Build Package (${{ matrix.component }} - ${{ matrix.arch }})
        run: |
          python3 scripts/build_packages.py -c "${{ matrix.component }}" -a "${{ matrix.arch }}"

      - name: Upload Built Packages
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.component }}-${{ matrix.arch }}
          path: |
            dist/deb/*.deb
            dist/rpm/*.rpm

  deploy-repo:
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Metadata Artifact
        uses: actions/download-artifact@v4
        with:
          name: metadata

      - name: Download All Built Package Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: artifacts
          merge-multiple: true

      - name: Install System Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm createrepo-c dpkg-dev gh
          pip install beautifulsoup4 jinja2 requests

      - name: Aggregate Packages into dist/
        run: |
          mkdir -p dist/deb dist/rpm
          cp -v artifacts/*.deb dist/deb/ || true
          cp -v artifacts/*.rpm dist/rpm/ || true
          ls -la dist/deb dist/rpm

      - name: Generate APT and RPM Repositories
        run: |
          python3 scripts/update_repo.py

      - name: Generate Web Portal
        run: |
          python3 scripts/generate_web.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create GitHub Release & Commit Version State
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/publish_release.py
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "chore: update version state [skip ci]" || true
          git push origin main || true
